[project]
name = "ankur-schemas"
version = "0.1.0"
description = "Pydantic domain schemas for DACP rules, citations, and documents (Ankur)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankur_schemas"]
