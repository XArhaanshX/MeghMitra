[project]
name = "ankur-geo"
version = "0.1.0"
description = "India-wide geographic reference data and resolution for Ankur: state/UT identity, district lookup keyed on (state, district) to prevent same-named-district collisions, legacy name aliasing, and per-region ML parameters (monsoon season windows, condition thresholds)."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankur_geo"]
