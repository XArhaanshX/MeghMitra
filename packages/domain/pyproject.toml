[project]
name = "ankur-domain"
version = "0.1.0"
description = "Business invariants, repository interfaces, and services for Ankur DACP rules."
requires-python = ">=3.12"
dependencies = [
    "ankur-schemas",
]

[tool.uv.sources]
ankur-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankur_domain"]
