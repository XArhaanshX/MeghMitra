name: web-image

on:
  push:
    branches: [main]
    paths:
      - apps/app/**
      - .github/workflows/web-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/xarhaanshx/meghmitra/web
  # Baked into the client bundle at build time -- see apps/app/src/env.ts.
  NEXT_PUBLIC_API_URL: https://api-meghmitra.upayan.dev

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/app
          file: apps/app/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      # See apps/api workflow's deploy job for why this pushes to vps
      # directly instead of relying on ArgoCD Image Updater.
      - uses: actions/checkout@v4
        with:
          repository: upayanmazumder/vps
          token: ${{ secrets.VPS_DEPLOY_TOKEN }}
          path: vps

      - name: install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: pin new image tag
        working-directory: vps/k8s/apps/de/meghmitra
        run: kustomize edit set image "${{ env.IMAGE }}=${{ env.IMAGE }}:sha-${{ needs.build-push.outputs.short_sha }}"

      - name: commit and push
        working-directory: vps
        run: |
          git config user.name "meghmitra-ci"
          git config user.email "ci@meghmitra.upayan.dev"
          git add k8s/apps/de/meghmitra/kustomization.yaml
          if git diff --cached --quiet; then
            echo "no image change, nothing to deploy"
            exit 0
          fi
          git commit -m "deploy: meghmitra web sha-${{ needs.build-push.outputs.short_sha }}"
          git push origin main
