services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ankur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ankur}
      POSTGRES_DB: ${POSTGRES_DB:-ankur}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ankur_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ankur} -d ${POSTGRES_DB:-ankur}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ankur_pgdata:
