[project]
name = "ankur-api"
version = "0.1.0"
description = "Ankur FastAPI service: thin routes over ankur_domain services."
requires-python = ">=3.12"
dependencies = [
    "ankur-schemas",
    "ankur-domain",
    "document-intelligence",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
ankur-schemas = { workspace = true }
ankur-domain = { workspace = true }
document-intelligence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
