[project]
name = "trigger-engine"
version = "0.1.0"
description = "Block-scale moisture state, calibrated dry-spell probability, and DACP condition matching."
requires-python = ">=3.12"
# numpy/pandas for the panel; scikit-learn for calibration. Deliberately no
# LightGBM/XGBoost/PyTorch: see models.py for why the model ladder stops at
# sklearn's HistGradientBoostingClassifier, which is compiled, CPU-fast, and
# supports the monotonic constraints this problem needs.
dependencies = [
    "ankur-schemas",
    "ankur-domain",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[tool.uv.sources]
ankur-schemas = { workspace = true }
ankur-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trigger_engine"]
