[tool.uv.workspace]
members = [
    "packages/schemas",
    "packages/domain",
    "packages/geo",
    "services/document-intelligence",
    "services/trigger-engine",
    "apps/api",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/generate_geo_reference.py -- one District(...) literal
# per ingested document; some district names are long enough to exceed the
# line-length limit. Do not hand-edit, regenerate instead.
"packages/geo/src/ankur_geo/_districts_generated.py" = ["E501"]
